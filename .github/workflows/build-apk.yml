name: Build Android APK

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual build'
        required: false
        default: 'Manual APK build for device installation'

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ──────────────────────────────────────────────────────────
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/GuardPayUI/package-lock.json

      # ── 3. JDK (must be 17 for Android builds) ──────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 4. Android SDK ──────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      # ── 5. npm install ──────────────────────────────────────────────────────
      - name: Install npm dependencies
        working-directory: frontend/GuardPayUI
        run: npm ci

      # ── 6. Make gradlew executable ──────────────────────────────────────────
      - name: Set gradlew permissions
        working-directory: frontend/GuardPayUI/android
        run: chmod +x ./gradlew

      # ── 7. Download Gradle wrapper jar ──────────────────────────────────────
      - name: Download Gradle wrapper jar
        working-directory: frontend/GuardPayUI/android
        run: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.8.0/gradle/wrapper/gradle-wrapper.jar"

      # ── 8. Build Debug APK ──────────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: frontend/GuardPayUI/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2048m"

      # ── 9. Rename APK ───────────────────────────────────────────────────────
      - name: Rename APK
        run: |
          mkdir -p output
          cp frontend/GuardPayUI/android/app/build/outputs/apk/debug/app-debug.apk \
             output/GuardPay-AI-debug.apk
          echo "APK size: $(du -sh output/GuardPay-AI-debug.apk)"

      # ── 10. Upload as artifact (available for 30 days) ───────────────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuardPay-AI-APK
          path: output/GuardPay-AI-debug.apk
          retention-days: 30

      # ── 11. Create/update GitHub Release with APK ────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "GuardPay AI — Latest Android APK"
          body: |
            ## 📱 GuardPay AI Android App
            
            > Built automatically from branch `${{ github.ref_name }}` — commit `${{ github.sha }}`
            
            ### Installation Steps (No Android Studio needed!)
            
            1. **Download** `GuardPay-AI-debug.apk` from the Assets section below
            2. **Transfer** the APK to your phone (USB cable, WhatsApp, email, etc.)
            3. On your phone: **Settings → Security → Enable "Install from unknown sources"**
               - On newer Android: Settings → Apps → Special app access → Install unknown apps
            4. Tap the APK file on your phone → **Install**
            5. Open **GuardPay AI** ✅
            
            ### Backend Setup
            Make sure the backend is running on your machine:
            ```
            cd GuardPay_AI && python run.py
            ```
            Then ensure your phone and computer are on the **same WiFi network**.
            
            > ⚠️ This is a debug build for testing. Not for production use.
          files: output/GuardPay-AI-debug.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
