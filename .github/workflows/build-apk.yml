name: Build Android APK

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/GuardPayUI/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build-tools
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: Generate fresh React Native 0.75.4 android/ folder
        run: |
          # react-native init requires the project name as first arg, no --directory flag in 0.75.x
          cd /tmp
          npx react-native@0.75.4 init GuardPayNative --version 0.75.4 --skip-install --yes 2>&1 | tail -30
          ls GuardPayNative/
          echo "--- android folder ---"
          ls GuardPayNative/android/

      - name: Copy android folder into our project
        run: |
          rm -rf frontend/GuardPayUI/android
          cp -r /tmp/GuardPayNative/android frontend/GuardPayUI/android
          # Patch app_name
          sed -i 's/<string name="app_name">GuardPayNative<\/string>/<string name="app_name">GuardPay AI<\/string>/g' \
            frontend/GuardPayUI/android/app/src/main/res/values/strings.xml
          # Add permissions
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CALL_PHONE" />|' \
            frontend/GuardPayUI/android/app/src/main/AndroidManifest.xml
          cat frontend/GuardPayUI/android/app/src/main/res/values/strings.xml

      - name: Install npm dependencies
        working-directory: frontend/GuardPayUI
        run: |
          npm install
          # React Native 0.75 uses the new metro config - ensure it's linked
          ls node_modules | grep "react-native" | head -10

      - name: Set gradlew executable
        working-directory: frontend/GuardPayUI/android
        run: chmod +x ./gradlew

      - name: Create local.properties
        working-directory: frontend/GuardPayUI/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        working-directory: frontend/GuardPayUI/android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --info \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            2>&1 | tail -80

      - name: Find and collect APK
        run: |
          mkdir -p apk-output
          find frontend/GuardPayUI/android -name "*.apk" -type f
          cp frontend/GuardPayUI/android/app/build/outputs/apk/debug/app-debug.apk \
             apk-output/GuardPay-AI-v1.0-debug.apk
          echo "APK ready: $(du -sh apk-output/GuardPay-AI-v1.0-debug.apk)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuardPay-AI-APK
          path: apk-output/GuardPay-AI-v1.0-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "GuardPay AI — Android APK"
          body: |
            ## 📱 GuardPay AI — Install on Android

            **Built from:** `${{ github.ref_name }}` @ `${{ github.sha }}`

            ### Install Steps (No Android Studio needed!)
            1. Download `GuardPay-AI-v1.0-debug.apk` from Assets below
            2. Transfer to phone (USB / WhatsApp / Google Drive)
            3. Phone: Settings → Security → Enable "Install from unknown sources"
            4. Tap the APK → Install
            5. Open GuardPay AI ✅

            ### Backend
            Run `python run.py` on your PC. Phone and PC must be on same WiFi.
          files: apk-output/GuardPay-AI-v1.0-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}